<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>자기소개 - 페이지 2</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Malgun Gothic", sans-serif;
      background: #1e1e2f;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .page {
      max-width: 480px;
      width: 100%;
      padding: 40px 24px 100px;
      text-align: center;
    }
    h4 { font-size: 1.2rem; line-height: 1.6; color: #ffd166; }
    hr { border: none; border-top: 2px solid #444466; margin: 20px 0; }
    .nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 16px;
      background: #14141f;
    }
    .nav a {
      text-decoration: none;
      color: #1e1e2f;
      background: #ffd166;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: bold;
      transition: transform 0.15s ease;
    }
    .nav a:hover { transform: scale(1.05); }
    .page-indicator { color: #888; font-size: 0.9rem; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="page">
    <h4>
      야구를 좋아하는 이유가 공을 던질때의 속도가 있어서이고
      에스파는 아이돌 입니다 뮤비 또는 노래 듣는걸 좋아합니다.
    </h4>
    <hr>
    <h4>
      또 집에서 유튜브 보기
      체육 배구 풋살 좋아하고 과학 좋아합니다.
    </h4>
    <p class="page-indicator">3 / 4 &middot; 페이지 2</p>
  </div>

  <div class="nav">
    <a href="page1.html">◀ 이전</a>
    <a href="page3.html">다음 ▶</a>
  </div>
</body>
</html>

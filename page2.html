    function animateCursorTrail() { cursorTrail.forEach((spark, index) => { if (index > 0) { trailPoints[index].x += (trailPoints[index - 1].x - trailPoints[index].x) * .2; trailPoints[index].y += (trailPoints[index - 1].y - trailPoints[index].y) * .2; } spark.style.transform = `translate(${trailPoints[index].x}px, ${trailPoints[index].y}px) translate(-50%, -50%)`; }); requestAnimationFrame(animateCursorTrail); }
    function sendShootingStar() { const star = document.createElement("span"); star.className = "shooting-star"; star.style.left = `${45 + Math.random() * 55}vw`; star.style.top = `${-5 + Math.random() * 38}vh`; document.body.appendChild(star); if (Math.random() < .5) { damageCastle(); const castle = document.querySelector(".castle-backdrop"); const state = JSON.parse(localStorage.getItem(castleStateKey) || '{"health":100,"rubbleCount":0}'); state.health = Number(castle.dataset.health); state.rubbleCount = 0; localStorage.setItem(castleStateKey, JSON.stringify(state)); } const duration = 1200 + Math.random() * 700; star.animate([{ transform: "translate(0,0) rotate(35deg) scale(.5)", opacity: 0 }, { transform: "translate(-18vw,22vh) rotate(35deg) scale(1)", opacity: 1, offset: .24 }, { transform: "translate(-55vw,70vh) rotate(35deg) scale(.7)", opacity: 0 }], { duration, easing: "ease-in" }); window.setTimeout(() => star.remove(), duration); }
    function damageCastle() { const castle = document.querySelector(".castle-backdrop"); if (!castle) return; if (Number(castle.dataset.health || 100) <= 0) return; const castleHealth = Math.max(0, Number(castle.dataset.health || 100) - 5); castle.dataset.health = castleHealth; castle.style.setProperty("--castle-opacity", castleHealth / 100); if (castleHealth <= 0) castle.classList.add("castle-gone"); const impact = document.createElement("span"); impact.className = "castle-impact"; impact.style.left = `${35 + Math.random() * 30}vw`; impact.style.top = `${35 + Math.random() * 22}vh`; document.body.appendChild(impact); castle.classList.add("castle-damaged"); for (let piece = 0; piece < 3; piece += 1) { const rubble = document.createElement("span"); rubble.className = "castle-rubble"; const startX = 24 + Math.random() * 52; const startY = 25 + Math.random() * 30; rubble.style.left = `${startX}vw`; rubble.style.top = `${startY}vh`; document.body.appendChild(rubble); const fallX = Math.random() * 150 - 75; const fallY = innerHeight - innerHeight * (startY / 100) - 28; rubble.animate([{ transform: "translate(0,0) rotate(0deg)", opacity: 1 }, { transform: `translate(${fallX}px,${fallY}px) rotate(${180 + Math.random() * 180}deg)`, opacity: .95 }], { duration: 1250 + piece * 90, easing: "cubic-bezier(.25,.7,.35,1)" }); window.setTimeout(() => rubble.remove(), 1500 + piece * 90); } window.setTimeout(() => { impact.remove(); castle.classList.remove("castle-damaged"); }, 700); }
    animateCursorTrail();
    window.setInterval(sendShootingStar, 3500);
  </script>
  <script>
    const themeControls = document.querySelector(".theme-controls");
    const themeToggle = document.createElement("button");
    themeToggle.className = "theme-toggle"; themeToggle.type = "button"; themeToggle.textContent = "▲"; themeToggle.setAttribute("aria-label", "테마 설정 접기"); themeControls.prepend(themeToggle);
    themeToggle.addEventListener("click", () => { themeControls.classList.toggle("is-collapsed"); themeToggle.textContent = themeControls.classList.contains("is-collapsed") ? "▼" : "▲"; });

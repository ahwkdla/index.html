<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>자기소개</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Malgun Gothic", sans-serif; background: #1e1e2f; color: #f0f0f0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    /* 기본적으로 페이지를 숨겨두고 active 클래스가 붙은 것만 보여줍니다 */
    .page { max-width: 480px; width: 100%; padding: 40px 24px 100px; text-align: center; display: none; }
    .page.active { display: block; }

    h1 { font-size: 2rem; color: #ffd166; margin-bottom: 8px; }
    h3, h4 { color: #ffd166; }
    h4 { line-height: 1.6; }
    mark { background: #ff6b6b; color: #1e1e2f; padding: 0 4px; border-radius: 4px; }
    hr { border: none; border-top: 2px solid #444466; margin: 20px 0; }
    p { line-height: 1.6; }
    img { max-width: 100%; border-radius: 12px; margin-top: 16px; }
    
    .nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: center; gap: 16px; padding: 16px; background: #14141f; }
    .nav button { border: none; cursor: pointer; color: #1e1e2f; background: #ffd166; padding: 12px 24px; border-radius: 30px; font-weight: bold; font-size: 1rem; transition: transform 0.15s ease; }
    .nav button:hover { transform: scale(1.05); }
  </style>
</head>
<body>

  <!-- 1페이지 -->
  <div id="page1" class="page active">
    <h1>자기소개</h1>
    <hr>
    <h3>이름&nbsp;:&nbsp;이선우</h3>
    <hr>
    <p>취미는 <mark>게임 그림</mark> 이고</p>
    <p>좋아하는건 <strong>야구</strong> <strong>에스파</strong> 입니다</p>
    <div class="nav">
      <button onclick="showPage(2)">다음 ▶</button>
    </div>
  </div>

  <!-- 2페이지 -->
  <div id="page2" class="page">
    <h1>좋아하는 것들</h1>
    <hr>
    <h4>야구를 좋아하는 이유가 공을 던질때의 속도가 있어서이고 에스파는 아이돌 입니다 뮤비 또는 노래 듣는걸 좋아합니다.</h4>
    <hr>
    <h4>또 집에서 유튜브 보기 체육 배구 풋살 좋아하고 과학 좋아합니다.</h4>
    <div class="nav">
      <button onclick="showPage(1)">◀ 이전</button>
      <button onclick="showPage(3)">다음 ▶</button>
    </div>
  </div>

  <!-- 3페이지 -->
  <div id="page3" class="page">
    <h1>나의 특징</h1>
    <hr>
    <h4>특징&nbsp;:&nbsp;특징은 착하다 장난이많다 재밌다 정도?</h4>
    <img src="https://ilovecharacter.com/news/data/20230403/p1065586446301593_269_thum.jpg" alt="이미지">
    <div class="nav">
      <button onclick="showPage(2)">◀ 이전</button>
      <button onclick="showPage(1)">처음으로 ↺</button>
    </div>
  </div>

  <script>
    function showPage(pageNumber) {
      // 모든 페이지 숨기기
      document.querySelectorAll('.page').forEach(page => {
        page.classList.remove('active');
      });
      // 선택한 페이지 나타내기
      document.getElementById('page' + pageNumber).classList.add('active');
      // 화면 맨 위로 스크롤
      window.scrollTo(0, 0);
    }
  </script>

</body>
</html>

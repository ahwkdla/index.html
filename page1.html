  <style>

    .theme-controls select, .theme-controls button { width: 100%; border: 1px solid rgba(151,255,235,.24); border-radius: 6px; background: rgba(20,31,65,.9); color: #f8dc87; font-family: "EB Garamond", Georgia, serif; font-size: 14px; }

    body[data-scene="mountain"] .scene-art::after { position: absolute; right: 0; bottom: 0; left: 0; height: 42%; content: ""; background: repeating-linear-gradient(72deg, #071525 0 13px, transparent 13px 28px); clip-path: polygon(0 100%,0 45%,5% 22%,10% 47%,16% 12%,22% 45%,28% 20%,34% 50%,41% 14%,48% 46%,55% 18%,62% 50%,70% 10%,78% 45%,86% 20%,93% 48%,100% 12%,100% 100%); }

    .weather-art { position: fixed; inset: 0; z-index: 0; pointer-events: none; } body[data-scene="sky"][data-weather="sun"] .weather-art::before { position: absolute; top: 12%; right: 16%; width: 92px; height: 92px; content: ""; border-radius: 50%; background: #fff3a6; box-shadow: 0 0 42px 16px rgba(255,226,117,.5); } body[data-scene="sky"][data-weather="rain"] .weather-art { opacity: .48; background: repeating-linear-gradient(108deg, transparent 0 18px, rgba(54,116,174,.28) 19px 20px, transparent 21px 34px); } body[data-scene="sky"][data-weather="snow"] .weather-art { opacity: .75; background-image: radial-gradient(circle, rgba(255,255,255,.9) 0 2px, transparent 2.5px), radial-gradient(circle, rgba(255,255,255,.75) 0 1.5px, transparent 2px); background-size: 72px 84px, 116px 128px; background-position: 12px 18px, 48px 64px; animation: snow-drift 12s linear infinite; } @keyframes snow-drift { to { background-position: 12px 102px, 48px 192px; } }
  </style>

  <script>
    const root = document.documentElement;
    const cursorTrail = [...document.querySelectorAll(".cursor-trail")];
    const trailPoints = cursorTrail.map(() => ({ x: innerWidth / 2, y: innerHeight / 2 }));
    const castleStateKey = "self-introduction-castle-state";
    const themeStateKey = "self-introduction-theme-state";
    const trailCanvas = document.querySelector(".cursor-canvas");
    const trailContext = trailCanvas.getContext("2d");
    let lastTrailUpdate = 0;
    const hueRange = document.querySelector("#hueRange"), rainbowToggle = document.querySelector("#rainbowToggle"), sceneSelect = document.querySelector("#sceneSelect"), weatherSelect = document.querySelector("#weatherSelect"), weatherControl = document.querySelector(".weather-control"), savedTheme = JSON.parse(localStorage.getItem(themeStateKey) || '{"hue":205,"rainbow":false,"scene":"sky","weather":"sun"}');
    hueRange.value = savedTheme.hue; sceneSelect.value = savedTheme.scene; weatherSelect.value = savedTheme.weather || "sun";
    function applyTheme() { document.documentElement.style.setProperty("--theme-hue", hueRange.value); document.body.dataset.scene = sceneSelect.value; document.body.dataset.weather = weatherSelect.value; document.body.classList.toggle("rainbow-mode", savedTheme.rainbow); weatherControl.hidden = sceneSelect.value !== "sky"; rainbowToggle.textContent = savedTheme.rainbow ? "기본 바탕" : "무지개 바탕"; localStorage.setItem(themeStateKey, JSON.stringify({ hue: Number(hueRange.value), rainbow: savedTheme.rainbow, scene: sceneSelect.value, weather: weatherSelect.value })); }
    hueRange.addEventListener("input", () => { savedTheme.hue = Number(hueRange.value); applyTheme(); }); sceneSelect.addEventListener("change", () => { savedTheme.scene = sceneSelect.value; applyTheme(); }); weatherSelect.addEventListener("change", () => { savedTheme.weather = weatherSelect.value; applyTheme(); }); rainbowToggle.addEventListener("click", () => { savedTheme.rainbow = !savedTheme.rainbow; applyTheme(); }); applyTheme();
    function resizeTrailCanvas() { const ratio = devicePixelRatio || 1; trailCanvas.width = innerWidth * ratio; trailCanvas.height = innerHeight * ratio; trailContext.setTransform(ratio, 0, 0, ratio, 0, 0); }
    function drawCursorLine() { trailContext.clearRect(0, 0, innerWidth, innerHeight); trailContext.beginPath(); trailContext.moveTo(trailPoints[0].x, trailPoints[0].y); trailPoints.slice(1).forEach((point) => trailContext.lineTo(point.x, point.y)); trailContext.strokeStyle = "rgba(151,255,235,.72)"; trailContext.lineWidth = 2; trailContext.lineCap = "round"; trailContext.lineJoin = "round"; trailContext.shadowColor = "rgba(91,235,219,.72)"; trailContext.shadowBlur = 7; trailContext.stroke(); requestAnimationFrame(drawCursorLine); }
    resizeTrailCanvas(); window.addEventListener("resize", resizeTrailCanvas); drawCursorLine();

    function restoreCastleState() {
      const castle = document.querySelector(".castle-backdrop");
      if (!castle) return;
      const state = JSON.parse(localStorage.getItem(castleStateKey) || '{"health":100,"rubbleCount":0}');
      castle.dataset.health = state.health;
      castle.style.setProperty("--castle-opacity", state.health / 100);
      if (state.health <= 0) castle.classList.add("castle-gone");
      state.rubbleCount = 0;
      localStorage.setItem(castleStateKey, JSON.stringify(state));
    }

    restoreCastleState();
    window.addEventListener("pointermove", (event) => {
      root.style.setProperty("--aurora-x", `${event.clientX}px`);
      root.style.setProperty("--aurora-y", `${event.clientY}px`);
      const now = performance.now();
      if (now - lastTrailUpdate < 24) return;
      lastTrailUpdate = now;
      trailPoints[0] = { x: event.clientX, y: event.clientY };
      cursorTrail.forEach((spark, index) => {
        if (index > 0) { trailPoints[index].x += (trailPoints[index - 1].x - trailPoints[index].x) * 0.34; trailPoints[index].y += (trailPoints[index - 1].y - trailPoints[index].y) * 0.34; }
        spark.style.transform = `translate(${trailPoints[index].x}px, ${trailPoints[index].y}px) translate(-50%, -50%)`;
      });
    });
    function animateCursorTrail() {
      cursorTrail.forEach((spark, index) => {
        if (index > 0) { trailPoints[index].x += (trailPoints[index - 1].x - trailPoints[index].x) * 0.2; trailPoints[index].y += (trailPoints[index - 1].y - trailPoints[index].y) * 0.2; }
        spark.style.transform = `translate(${trailPoints[index].x}px, ${trailPoints[index].y}px) translate(-50%, -50%)`;
      });
      requestAnimationFrame(animateCursorTrail);
    }
    function sendShootingStar() {
      if (document.body.dataset.scene !== "mountain") return;
      const star = document.createElement("span"); star.className = "shooting-star"; star.style.left = `${45 + Math.random() * 55}vw`; star.style.top = `${-5 + Math.random() * 38}vh`; document.body.appendChild(star);
      if (Math.random() < 0.5) damageCastle();
      const duration = 1200 + Math.random() * 700;
      star.animate([{ transform: "translate(0, 0) rotate(35deg) scale(0.5)", opacity: 0 }, { transform: "translate(-18vw, 22vh) rotate(35deg) scale(1)", opacity: 1, offset: 0.24 }, { transform: "translate(-55vw, 70vh) rotate(35deg) scale(0.7)", opacity: 0 }], { duration, easing: "ease-in" });
      window.setTimeout(() => star.remove(), duration);
    }
    animateCursorTrail();
    function damageCastle() {
      const castle = document.querySelector(".castle-backdrop");
      if (!castle) return;
      if (Number(castle.dataset.health || 100) <= 0) return;
      const castleHealth = Math.max(0, Number(castle.dataset.health || 100) - 5);
      castle.dataset.health = castleHealth;
      castle.style.setProperty("--castle-opacity", castleHealth / 100);
      if (castleHealth <= 0) castle.classList.add("castle-gone");
      const state = JSON.parse(localStorage.getItem(castleStateKey) || '{"health":100,"rubbleCount":0}');
      state.health = castleHealth;
      state.rubbleCount = 0;
      localStorage.setItem(castleStateKey, JSON.stringify(state));
      const impact = document.createElement("span"); impact.className = "castle-impact"; impact.style.left = `${35 + Math.random() * 30}vw`; impact.style.top = `${35 + Math.random() * 22}vh`; document.body.appendChild(impact);
      castle.classList.add("castle-damaged");
      for (let piece = 0; piece < 3; piece += 1) { const rubble = document.createElement("span"); rubble.className = "castle-rubble"; const startX = 24 + Math.random() * 52; const startY = 25 + Math.random() * 30; rubble.style.left = `${startX}vw`; rubble.style.top = `${startY}vh`; document.body.appendChild(rubble); const fallX = Math.random() * 150 - 75; const fallY = innerHeight - innerHeight * (startY / 100) - 28; rubble.animate([{ transform: "translate(0,0) rotate(0deg)", opacity: 1 }, { transform: `translate(${fallX}px,${fallY}px) rotate(${180 + Math.random() * 180}deg)`, opacity: .95 }], { duration: 1250 + piece * 90, easing: "cubic-bezier(.25,.7,.35,1)", fill: "forwards" }); window.setTimeout(() => rubble.remove(), 1500 + piece * 90); }
      window.setTimeout(() => { impact.remove(); castle.classList.remove("castle-damaged"); }, 700);
    }
    window.setInterval(sendShootingStar, 3500);
  </script>
  <script>
    const themeControls = document.querySelector(".theme-controls");
    const themeToggle = document.createElement("button");
    themeToggle.className = "theme-toggle"; themeToggle.type = "button"; themeToggle.textContent = "▲"; themeToggle.setAttribute("aria-label", "테마 설정 접기"); themeControls.prepend(themeToggle);
    themeToggle.addEventListener("click", () => { themeControls.classList.toggle("is-collapsed"); themeToggle.textContent = themeControls.classList.contains("is-collapsed") ? "▼" : "▲"; });
  </script>
  <style>body[data-scene="sky"][data-weather="snow"] .weather-art { animation-duration: 5s !important; }</style>
</body>

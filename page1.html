<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자기소개 - 페이지 1</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 text-white">

  <!-- 메인 내용 -->
  <main class="min-h-screen flex items-center justify-center px-6 pb-28">

    <div class="w-full max-w-lg text-center">

      <!-- 페이지 제목 -->
      <p class="mb-3 text-sm font-semibold tracking-[0.3em] text-yellow-300">
        ABOUT ME
      </p>

      <h1 class="text-4xl font-extrabold
                 bg-gradient-to-r from-yellow-300 to-amber-500
                 bg-clip-text text-transparent">
        나에 대해서
      </h1>

      <!-- 이름 -->
      <div class="mt-8 rounded-2xl border border-white/10
                  bg-white/5 p-6 backdrop-blur-sm">

        <h2 class="text-2xl font-bold text-yellow-300">
          이름 : 이선우
        </h2>

      </div>

      <!-- 취미 -->
      <div class="mt-5 rounded-2xl border border-white/10
                  bg-white/5 p-6 backdrop-blur-sm">

        <p class="text-lg text-slate-300">
          취미는
          <span class="mx-1 rounded-md bg-red-400 px-2 py-1
                       font-semibold text-slate-900">
            게임 그림
          </span>
          이고
        </p>

      </div>

      <!-- 좋아하는 것 -->
      <div class="mt-5 rounded-2xl border border-white/10
                  bg-white/5 p-6 backdrop-blur-sm">

        <p class="text-lg text-slate-300">
          좋아하는건
        </p>

        <div class="mt-3 flex justify-center gap-3">

          <span class="rounded-full bg-red-500/20
                       px-4 py-2 font-bold text-red-300">
            ⚾ 야구
          </span>

          <span class="rounded-full bg-pink-500/20
                       px-4 py-2 font-bold text-pink-300">
            🎵 에스파
          </span>

        </div>

      </div>

      <!-- 페이지 번호 -->
      <p class="mt-8 text-sm text-slate-400">
        <span class="font-semibold text-yellow-300">2</span>
        / 4
        <span class="mx-2">·</span>
        페이지 1
      </p>

    </div>

  </main>


  <!-- 하단 네비게이션 -->
  <nav class="fixed bottom-0 left-0 right-0
              border-t border-white/10
              bg-slate-950/80 backdrop-blur-lg">

    <div class="flex justify-center gap-3 p-4">

      <!-- 메인으로 -->
      <a
        href="index.html"
        class="group flex items-center gap-2
               rounded-full border border-white/10
               bg-white/10 px-6 py-3
               font-semibold text-white
               transition duration-200
               hover:-translate-y-1
               hover:bg-white/20"
      >
        ◀ 메인
      </a>

      <!-- 다음 페이지 -->
      <a
        href="page2.html"
        class="group flex items-center gap-2
               rounded-full
               bg-gradient-to-r from-yellow-300 to-amber-400
               px-6 py-3
               font-bold text-slate-900
               shadow-lg shadow-yellow-500/20
               transition duration-200
               hover:-translate-y-1
               hover:shadow-xl hover:shadow-yellow-500/30"
      >
        다음
        <span class="transition-transform duration-200 group-hover:translate-x-1">
          ▶
        </span>
      </a>

    </div>

  </nav>

</body>
</html>
